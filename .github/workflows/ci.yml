name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed packages
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q app.py

      - name: Smoke test Streamlit app
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 &
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail http://localhost:8501/_stcore/health

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag planilha-roberta:${{ github.sha }} .

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs:
      - python
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            -czf /tmp/planilha-roberta.tar.gz .

      - name: Upload application
        run: |
          scp -i ~/.ssh/hetzner /tmp/planilha-roberta.tar.gz "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/planilha-roberta.tar.gz"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/hetzner "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" << 'EOF'
            set -e

            APP_DIR="/root/planilha-roberta"
            mkdir -p "$APP_DIR"

            tar -xzf /tmp/planilha-roberta.tar.gz -C "$APP_DIR"
            rm -f /tmp/planilha-roberta.tar.gz

            cd "$APP_DIR"
            docker network inspect npm_default >/dev/null 2>&1 || docker network create npm_default
            docker compose up -d --build
          EOF
